<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" aria-labelledby="title desc" role="img" viewBox="0 0 1280 780"><title id="title">POS Pulse repository structure and runtime flow</title><desc id="desc">Animated structure diagram showing how cashier input travels through the React renderer, typed preload bridge, Electron main process, into local SQLite migrations and secrets, and out to the SmartDataPulse SaaS backend. Side rails show Spec Kit governance, the test suite, and the migration runner that frame every layer.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#020617"/><stop offset=".5" stop-color="#0b1220"/><stop offset="1" stop-color="#020617"/></linearGradient><radialGradient id="bg-glow" cx=".5" cy=".45" r=".6"><stop offset="0" stop-color="#1e3a8a" stop-opacity=".45"/><stop offset="1" stop-color="#020617" stop-opacity="0"/></radialGradient><linearGradient id="rail" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#1e293b" stop-opacity=".45"/><stop offset="1" stop-color="#1e293b" stop-opacity=".18"/></linearGradient><linearGradient id="n-blue" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#60a5fa"/><stop offset=".6" stop-color="#2563eb"/><stop offset="1" stop-color="#1e3a8a"/></linearGradient><linearGradient id="n-teal" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#5eead4"/><stop offset=".6" stop-color="#0d9488"/><stop offset="1" stop-color="#134e4a"/></linearGradient><linearGradient id="n-violet" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#c4b5fd"/><stop offset=".6" stop-color="#7c3aed"/><stop offset="1" stop-color="#4c1d95"/></linearGradient><linearGradient id="n-amber" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#fcd34d"/><stop offset=".6" stop-color="#d97706"/><stop offset="1" stop-color="#7c2d12"/></linearGradient><linearGradient id="n-emerald" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#86efac"/><stop offset=".6" stop-color="#16a34a"/><stop offset="1" stop-color="#14532d"/></linearGradient><linearGradient id="n-rose" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#fda4af"/><stop offset=".6" stop-color="#e11d48"/><stop offset="1" stop-color="#881337"/></linearGradient><linearGradient id="n-slate" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#cbd5e1"/><stop offset=".6" stop-color="#475569"/><stop offset="1" stop-color="#1e293b"/></linearGradient><linearGradient id="gloss" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".35" stop-color="#fff" stop-opacity="0"/></linearGradient><filter id="lift" width="140%" height="160%" x="-20%" y="-20%"><feDropShadow dx="0" dy="6" flood-color="#000" flood-opacity=".55" stdDeviation="6"/></filter><filter id="glow" width="200%" height="200%" x="-50%" y="-50%"><feGaussianBlur result="blur" stdDeviation="3"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><symbol id="node" overflow="visible"><rect width="220" height="88" x="-110" y="-44" fill="#0f172a" filter="url(#lift)" opacity=".92" rx="18"/><rect width="220" height="88" x="-110" y="-44" fill="url(#gloss)" opacity=".35" rx="18"/><rect width="220" height="88" x="-110" y="-44" fill="none" stroke="#1e293b" stroke-width="1" rx="18"/></symbol><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#94a3b8" d="M0 0 L10 5 L0 10 z"/></marker><marker id="arrow-bright" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#60a5fa" d="M0 0 L10 5 L0 10 z"/></marker></defs><rect width="1280" height="780" fill="url(#bg)"/><rect width="1280" height="780" fill="url(#bg-glow)"/><g fill="#e2e8f0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"><text x="40" y="56" fill="#f8fafc" font-size="26" font-weight="800" letter-spacing=".4">POS Pulse · runtime &amp; repository flow</text><text x="40" y="84" fill="#94a3b8" font-size="14">Cashier ➜ Renderer ➜ Typed bridge ➜ Main ➜ SQLite + Secrets ➜ SaaS · governed by Spec Kit, migrations, and tests.</text><g opacity=".95"><rect width="180" height="600" x="40" y="120" fill="url(#rail)" rx="22"/><rect width="180" height="600" x="40" y="120" fill="none" stroke="#1e293b" rx="22"/><text x="130" y="148" fill="#cbd5e1" font-size="13" font-weight="700" text-anchor="middle">SPEC KIT GOVERNANCE</text><text x="130" y="166" fill="#64748b" font-size="11" text-anchor="middle">.specify/ · constitution · gates</text><g fill="#cbd5e1" font-size="12" text-anchor="middle"><text x="130" y="220">specs/001 ▸ 009</text><text x="130" y="246" fill="#94a3b8" font-size="11">foundation → product search</text><text x="130" y="298">/speckit-specify</text><text x="130" y="324">/speckit-plan</text><text x="130" y="350">/speckit-tasks</text><text x="130" y="376">/speckit-analyze</text><text x="130" y="402">/speckit-implement</text><text x="130" y="470" fill="#94a3b8" font-size="11">constitutional rules</text><text x="130" y="492">no float money</text><text x="130" y="514">typed bridge only</text><text x="130" y="536">durable local state</text><text x="130" y="558">test-first</text><text x="130" y="580">audit ≠ PII</text></g></g><g opacity=".95"><rect width="180" height="600" x="1060" y="120" fill="url(#rail)" rx="22"/><rect width="180" height="600" x="1060" y="120" fill="none" stroke="#1e293b" rx="22"/><text x="1150" y="148" fill="#cbd5e1" font-size="13" font-weight="700" text-anchor="middle">QUALITY &amp; STATE</text><text x="1150" y="166" fill="#64748b" font-size="11" text-anchor="middle">tests · migrations · CI</text><g fill="#cbd5e1" font-size="12" text-anchor="middle"><text x="1150" y="220">vitest · happy-dom</text><text x="1150" y="244">axe-core a11y</text><text x="1150" y="268">tests/integration</text><text x="1150" y="292">tests/contract</text><text x="1150" y="346">migrations/ (SQL)</text><tex