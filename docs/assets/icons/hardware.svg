<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">Hardware icon</title>
  <desc id="desc">Three-dimensional POS hardware: terminal, receipt printer, and scanner.</desc>
  <defs>
    <linearGradient id="hw-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffbeb"/>
      <stop offset="1" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="hw-monitor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#475569"/>
      <stop offset="0.5" stop-color="#334155"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="hw-screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfdbfe"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="hw-scanner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="hw-hi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="hw-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.32"/>
    </filter>
  </defs>
  <rect width="96" height="96" rx="20" fill="url(#hw-bg)"/>
  <ellipse cx="48" cy="84" rx="32" ry="3" fill="#0f172a" opacity="0.16"/>
  <g filter="url(#hw-shadow)">
    <rect x="16" y="20" width="64" height="36" rx="4" fill="url(#hw-monitor)"/>
    <rect x="16" y="20" width="64" height="36" rx="4" fill="url(#hw-hi)" opacity="0.5"/>
    <rect x="22" y="26" width="52" height="24" rx="2" fill="url(#hw-screen)"/>
  </g>
  <g fill="#1e3a8a" opacity="0.6">
    <rect x="26" y="30" width="20" height="2" rx="1"/>
    <rect x="26" y="35" width="32" height="2" rx="1"/>
    <rect x="26" y="40" width="24" height="2" rx="1"/>
    <rect x="26" y="45" width="28" height="2" rx="1"/>
  </g>
  <rect x="38" y="56" width="20" height="4" fill="#1e293b"/>
  <rect x="32" y="60" width="32" height="3" rx="1" fill="#1e293b"/>
  <g filter="url(#hw-shadow)">
    <rect x="20" y="64" width="26" height="16" rx="3" fill="url(#hw-scanner)"/>
    <rect x="20" y="64" width="26" height="16" rx="3" fill="url(#hw-hi)"/>
  </g>
  <g stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" opacity="0.95">
    <path d="M24 68v8"/>
    <path d="M28 68v8"/>
    <path d="M31 68v8"/>
    <path d="M35 68v8"/>
    <path d="M39 68v8"/>
    <path d="M42 68v8"/>
  </g>
  <g stroke="#0f766e" stroke-width="3" stroke-linecap="round">
    <path d="M54 68h22"/>
    <path d="M54 76h16"/>
  </g>
  <circle cx="76" cy="22" r="3" fill="#22c55e">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.4s" repeatCount="indefinite"/>
  </circle>
</svg>
