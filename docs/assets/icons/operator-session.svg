<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">Operator session icon</title>
  <desc id="desc">Three-dimensional operator silhouette with secure session indicator.</desc>
  <defs>
    <linearGradient id="os-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f5f9"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
    <radialGradient id="os-head" cx="0.4" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#93c5fd"/>
      <stop offset="0.4" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </radialGradient>
    <linearGradient id="os-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="0.5" stop-color="#0d9488"/>
      <stop offset="1" stop-color="#134e4a"/>
    </linearGradient>
    <linearGradient id="os-badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="os-hi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="os-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.32"/>
    </filter>
  </defs>
  <rect width="96" height="96" rx="20" fill="url(#os-bg)"/>
  <ellipse cx="48" cy="84" rx="28" ry="3" fill="#0f172a" opacity="0.18"/>
  <g filter="url(#os-shadow)">
    <path d="M22 78c4-16 14-24 26-24s22 8 26 24z" fill="url(#os-body)"/>
    <path d="M22 78c4-16 14-24 26-24s22 8 26 24z" fill="url(#os-hi)" opacity="0.5"/>
    <circle cx="48" cy="34" r="15" fill="url(#os-head)"/>
    <circle cx="42" cy="29" r="5" fill="#ffffff" opacity="0.3"/>
  </g>
  <g filter="url(#os-shadow)">
    <rect x="58" y="18" width="20" height="24" rx="6" fill="url(#os-badge)"/>
    <rect x="58" y="18" width="20" height="24" rx="6" fill="url(#os-hi)"/>
  </g>
  <path d="M65 30h6" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <circle cx="68" cy="30" r="2.5" fill="#ffffff">
    <animate attributeName="opacity" values="1;0.4;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="68" cy="22" r="2" fill="#34d399">
    <animate attributeName="r" values="2;3;2" dur="1.6s" repeatCount="indefinite"/>
  </circle>
</svg>
