rminal state</text><g filter="url(#soft)"><rect width="226" height="72" x="880" y="112" fill="#fff" stroke="#cbd5e1" rx="14"/><rect width="226" height="72" x="880" y="112" fill="url(#hi)" opacity=".6" rx="14"/><circle cx="908" cy="148" r="11" fill="url(#blue)"/><path fill="#fff" d="M903 148 a5 5 0 1 0 10 0 a5 5 0 1 0 -10 0"/></g><text x="930" y="145" class="dark">SmartDataPulse API</text><text x="930" y="168" class="small">External SaaS backend</text><circle cx="1090" cy="148" r="4" fill="#22c55e"><animate attributeName="opacity" dur="1.6s" repeatCount="indefinite" values="1;0.3;1"/></circle><g filter="url(#soft)"><rect width="200" height="72" x="128" y="468" fill="url(#slate)" rx="14"/><rect width="200" height="72" x="128" y="468" fill="url(#hi)" opacity=".5" rx="14"/></g><g fill="#94a3b8"><rect width="36" height="22" x="148" y="488" rx="3"/><rect width="36" height="22" x="190" y="488" rx="3"/><rect width="36" height="22" x="232" y="488" rx="3"/></g><text x="158" y="528" class="white">Hardware</text><text x="158" y="544" class="whiteSmall" opacity="0">Scanner · printer · drawer</text><g transform="translate(72, 638)"><rect width="380" height="60" fill="#fff" stroke="#e2e8f0" rx="10"/><circle cx="22" cy="22" r="5" fill="#2563eb"/><text x="36" y="26" class="legend">Authenticated IPC</text><circle cx="22" cy="44" r="4" fill="#f59e0b"/><text x="36" y="48" class="legend">Local-only data path</text><circle cx="180" cy="22" r="5" fill="#0f766e"/><text x="194" y="26" class="legend">Contract-backed call</text><circle cx="180" cy="44" r="4" fill="#94a3b8"/><text x="194" y="48" class="legend">External SaaS link</text></g><circle cx="610" cy="268" r="22" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0"><animate attributeName="r" dur="3.4s" repeatCount="indefinite" values="6;48;6"/><animate attributeName="opacity" dur="3.4s" repeatCount="indefinite" values="0.6;0;0.6"/></circle><circle cx="1062" cy="362" r="22" fill="none" stroke="#5eead4" stroke-width="1.5" opacity=