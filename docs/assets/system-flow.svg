<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" aria-labelledby="title desc" role="img" viewBox="0 0 1280 640"><title id="title">POS Pulse end-to-end transaction flow</title><desc id="desc">Animated swim-lane flow showing a sale travelling from cashier through renderer, preload bridge, main process, SQLite, secrets, and out to the SaaS backend.</desc><defs><linearGradient id="sf-bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset=".55" stop-color="#0e2236"/><stop offset="1" stop-color="#0b1220"/></linearGradient><linearGradient id="lane-a" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#1e3a8a" stop-opacity=".4"/><stop offset="1" stop-color="#1e3a8a" stop-opacity=".08"/></linearGradient><linearGradient id="lane-b" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#0f766e" stop-opacity=".42"/><stop offset="1" stop-color="#0f766e" stop-opacity=".08"/></linearGradient><linearGradient id="lane-c" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#d97706" stop-opacity=".38"/><stop offset="1" stop-color="#d97706" stop-opacity=".08"/></linearGradient><linearGradient id="lane-d" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#7c3aed" stop-opacity=".36"/><stop offset="1" stop-color="#7c3aed" stop-opacity=".08"/></linearGradient><linearGradient id="node-blue" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient><linearGradient id="node-teal" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#0f766e"/></linearGradient><linearGradient id="node-amber" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#b45309"/></linearGradient><linearGradient id="node-violet" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#6d28d9"/></linearGradient><linearGradient id="hi" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient><filter id="glow" width="200%" height="200%" x="-50%" y="-50%"><feGaussianBlur stdDeviation="3"/></filter><filter id="drop" width="160%" height="160%" x="-30%" y="-30%"><feDropShadow dx="0" dy="6" flood-color="#000" flood-opacity=".5" stdDeviation="6"/></filter><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#e2e8f0" d="M0 0 L10 5 L0 10 z"/></marker><style>.title{font:800 28px Arial,sans-serif;fill:#f1f5f9}.subtitle{font:500 15px Arial,sans-serif;fill:#94a3b8}.lane{font:800 14px Arial,sans-serif;letter-spacing:1px;fill:#cbd5e1}.nodeTitle{font:800 16px Arial,sans-serif;fill:#fff}.nodeText{font:600 11px Arial,sans-serif;fill:#e2e8f0}.pill{font:700 11px Arial,sans-serif;fill:#f1f5f9}</style><path id="p1" fill="none" d="M170 200 C220 200 240 200 290 200"/><path id="p2" fill="none" d="M410 200 C460 200 480 200 530 200"/><path id="p3" fill="none" d="M650 200 C700 200 720 200 770 200"/><path id="p4" fill="none" d="M890 200 C940 200 960 200 1010 200"/><path id="p5" fill="none" d="M830 240 C830 290 830 320 830 360"/><path id="p6" fill="none" d="M830 460 C830 500 830 510 830 540"/><path id="p7" fill="none" d="M1070 240 C1070 280 920 320 830 360"/></defs><rect width="1280" height="640" fill="url(#sf-bg)"/><text x="60" y="56" class="title">End-to-end transaction flow</text><text x="60" y="84" class="subtitle">A sale travels through every process boundary — and never crosses one without a contract.</text><g><rect width="1160" height="80" x="60" y="110" fill="url(#lane-a)" stroke="#1e3a8a" stroke-opacity=".5" rx="12"/><text x="80" y="158" class="lane">RENDERER · UI</text><rect width="1160" height="80" x="60" y="350" fill="url(#lane-b)" stroke="#0f766e" stroke-opacity=".5" rx="12"/><text x="80" y="398" class="lane">MAIN · CORE SERVICES</text><rect width="1160" height="80" x="60" y="530" fill="url(#lane-c)" stroke="#d97706" stroke-opacity=".5" rx="12"/><text x="80" y="578" class="lane">LOCAL DURABLE STATE</text></g><g fill="none" stroke="#475569" stroke-dasharray="4 6" stroke-width="1.5"><path d="M830 240 L830 350"/><path d="M830 430 L830 530"/></g><g fill="none" stroke="#cbd5e1" stroke-linecap="round" stroke-width="2.5" marker-end="url(#arrow)" opacity=".7"><path d="M170 200 H290"/><path d="M410 200 H530"/><path d="M650 200 H770"/><path d="M890 200 H1010"/></g><g fill="none" stroke="#5eead4" stroke-linecap="round" stroke-width="2.5" marker-end="url(#arrow)" opacity=".65"><path d="M830 240 V360"/></g><g fill="none" stroke="#fbbf24" stroke-linecap="round" stroke-width="2.5" marker-end="url(#arrow)" opacity=".65"><path d="M830 460 V540"/></g><g filter="url(#drop)" transform="translate(80 160)"><rect width="90" height="80" fill="#1e3a8a" rx="14"/><rect width="90" height="80" fill="url(#hi)" rx="14"/><rect width="90" height="80" fill="none" stroke="#60a5fa" stroke-opacity=".7" rx="14"/><text x="45" y="35" class="nodeTitle" text-anchor="middle">1</text><text x="45" y="56" class="nodeText" text-anchor="middle">Scan</text><text x="45" y="70" class="nodeText" text-anchor="middle">SKU</text></g><g filter="url(#drop)" transform="translate(290 160)"><rect width="120" height="80" fill="url(#node-blue)" rx="14"/><rect width="120" height="80" fill="url(#hi)" rx="14"/><text x="60" y="32" class="nodeTitle" text-anchor="middle">Cart</text><text x="60" y="52" class="nodeText" text-anchor="middle">React state</text><text x="60" y="68" class="nodeText" text-anchor="middle">money in minor units</text></g><g filter="url(#drop)" transform="translate(530 160)"><rect width="120" height="80" fill="#fff" rx="14"/><rect width="120" height="80" fill="url(#hi)" rx="14"/><text x="60" y="32" fill="#0f172a" class="nodeTitle" text-anchor="middle">Preload</text><text x="60" y="52" fill="#475569" class="nodeText" text-anchor="middle">contextBridge</text><text x="60" y="68" fill="#475569" class="nodeText" text-anchor="middle">typed contract</text></g><g filter="url(#drop)" transform="translate(770 160)"><rect width="120" height="80" fill="url(#node-teal)" rx="14"/><rect width="120" height="80" fill="url(#hi)" rx="14"/><text x="60" y="32" class="nodeTitle" text-anchor="middle">Validate</text><text x="60" y="52" class="nodeText" text-anchor="middle">Zod + invariant</text><text x="60" y="68" class="nodeText" text-anchor="middle">money rules</text></g><g filter="url(#drop)" transform="translate(1010 160)"><rect width="120" height="80" fill="url(#node-violet)" rx="14"/><rect width="120" height="80" fill="url(#hi)" rx="14"/><text x="60" y="32" class="nodeTitle" text-anchor="middle">Audit</text><text x="60" y="52" class="nodeText" text-anchor="middle">redacted event</text><text x="60" y="68" class="nodeText" text-anchor="middle">PII-free</text></g><g filter="url(#drop)" transform="translate(770 360)"><rect width="120" height="80" fill="url(#node-teal)" rx="14"/><rect width="120" height="80" fill="url(#hi)" rx="14"/><text x="60" y="32" class="nodeTitle" text-anchor="middle">Commit</text><text x="60" y="52" class="nodeText" text-anchor="middle">transactional</text><text x="60" y="68" class="nodeText" text-anchor="middle">migration runner</text></g><g filter="url(#drop)" transform="translate(770 540)"><rect width="120" height="80" fill="url(#node-amber)" rx="14"/><rect width="120" height="80" fill="url(#hi)" rx="14"/><text x="60" y="32" class="nodeTitle" text-anchor="middle">SQLite</text><text x="60" y="52" class="nodeText" text-anchor="middle">durable receipt</text><text x="60" y="68" class="nodeText" text-anchor="middle">+ audit_events</text></g><g filter="url(#drop)" transform="translate(1010 360)"><rect width="170" height="80" fill="#0f172a" stroke="#22d3ee" stroke-opacity=".6" rx="14"/><rect width="170" height="80" fill="url(#hi)" rx="14"/><text x="20" y="34" class="nodeTitle">SaaS sync</text><text x="20" y="56" class="nodeText">contract-backed</text><text x="20" y="70" class="nodeText">when online · idempotent</text><circle cx="156" cy="20" r="4" fill="#22c55e"><animate attributeName="opacity" dur="1.6s" repeatCount="indefinite" values="1;0.3;1"/></circle></g><g filter="url(#drop)" transform="translate(80 360)"><rect width="170" height="80" fill="#0f172a" stroke="#f59e0b" stroke-opacity=".7" rx="14"/><rect width="170" height="80" fill="url(#hi)" rx="14"/><text x="20" y="34" class="nodeTitle">Hardware</text><text x="20" y="56" class="nodeText">printer · drawer</text><text x="20" y="70" class="nodeText">scanner (HID wedge)</text><circle cx="156" cy="20" r="4" fill="#f59e0b"><animate attributeName="opacity" begin="0.4s" dur="1.6s" repeatCount="indefinite" values="1;0.3;1"/></circle></g><g><circle r="6" fill="#22d3ee" filter="url(#glow)"><animateMotion dur="6s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion><animate attributeName="opacity" dur="6s" keyTimes="0;0.5;1" repeatCount="indefinite" values="0;1;0"/></circle><circle r="6" fill="#22d3ee" filter="url(#glow)"><animateMotion begin="0.6s" dur="6s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion><animate attributeName="opacity" begin="0.6s" dur="6s" keyTimes="0;0.5;1" repeatCount="indefinite" values="0;1;0"/></circle><circle r="6" fill="#5eead4" filter="url(#glow)"><animateMotion begin="1.2s" dur="6s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion><animate attributeName="opacity" begin="1.2s" dur="6s" keyTimes="0;0.5;1" repeatCount="indefinite" values="0;1;0"/></circle><circle r="6" fill="#c4b5fd" filter="url(#glow)"><animateMotion begin="1.8s" dur="6s" repeatCount="indefinite"><mpath href="#p4"/></animateMotion><animate attributeName="opacity" begin="1.8s" dur="6s" keyTimes="0;0.5;1" repeatCount="indefinite" values="0;1;0"/></circle><circle r="6" fill="#5eead4" filter="url(#glow)"><animateMotion begin="2.4s" dur="6s" repeatCount="indefinite"><mpath href="#p5"/></animateMotion><animate attributeName="opacity" begin="2.4s" dur="6s" keyTimes="0;0.5;1" repeatCount="indefinite" values="0;1;0"/></circle><circle r="6" fill="#fbbf24" filter="url(#glow)"><animateMotion begin="3s" dur="6s" repeatCount="indefinite"><mpath href="#p6"/></animateMotion><animate attributeName="opacity" begin="3s" dur="6s" keyTimes="0;0.5;1" repeatCount="indefinite" values="0;1;0"/></circle><circle r="5" fill="#22d3ee" filter="url(#glow)"><animateMotion begin="4s" dur="7s" repeatCount="indefinite"><mpath href="#p7"/></animateMotion><animate attributeName="opacity" begin="4s" dur="7s" keyTimes="0;0.5;1" repeatCount="indefinite" values="0;0.9;0"/></circle></g><g><rect width="22" height="18" x="225" y="120" fill="#22d3ee" opacity=".85" rx="9"/><text x="236" y="134" class="pill" text-anchor="middle">1</text><rect width="22" height="18" x="465" y="120" fill="#22d3ee" opacity=".85" rx="9"/><text x="476" y="134" class="pill" text-anchor="middle">2</text><rect width="22" height="18" x="705" y="120" fill="#22d3ee" opacity=".85" rx="9"/><text x="716" y="134" class="pill" text-anchor="middle">3</text><rect width="22" height="18" x="945" y="120" fill="#22d3ee" opacity=".85" rx="9"/><text x="956" y="134" class="pill" text-anchor="middle">4</text></g></svg>