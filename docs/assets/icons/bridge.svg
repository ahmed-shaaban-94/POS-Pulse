<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">Typed bridge icon</title>
  <desc id="desc">Three-dimensional typed preload bridge linking renderer and main process.</desc>
  <defs>
    <linearGradient id="br-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#c7d2fe"/>
    </linearGradient>
    <linearGradient id="br-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="br-teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="br-hi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="br-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#1e3a8a" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="96" height="96" rx="20" fill="url(#br-bg)"/>
  <ellipse cx="48" cy="84" rx="28" ry="2.5" fill="#1e3a8a" opacity="0.15"/>
  <g filter="url(#br-shadow)">
    <rect x="14" y="24" width="26" height="48" rx="6" fill="url(#br-blue)"/>
    <rect x="14" y="24" width="26" height="48" rx="6" fill="url(#br-hi)"/>
    <rect x="56" y="24" width="26" height="48" rx="6" fill="url(#br-teal)"/>
    <rect x="56" y="24" width="26" height="48" rx="6" fill="url(#br-hi)"/>
  </g>
  <g stroke="#334155" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M40 38h16"/>
    <path d="M40 58h16"/>
  </g>
  <g stroke="#f59e0b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="m51 31 7 7-7 7"/>
    <path d="m45 51-7 7 7 7"/>
  </g>
  <g fill="#fbbf24">
    <circle cx="48" cy="38" r="2">
      <animate attributeName="cx" values="40;56;40" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="48" cy="58" r="2">
      <animate attributeName="cx" values="56;40;56" dur="2.6s" begin="1.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="2.6s" begin="1.3s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
