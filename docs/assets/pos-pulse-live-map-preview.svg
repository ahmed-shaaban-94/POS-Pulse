<svg xmlns="http://www.w3.org/2000/svg" fill="none" aria-labelledby="title desc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" role="img" viewBox="0 0 1280 620"><title id="title">POS Pulse live terminal map preview</title><desc id="desc">A GitHub-safe preview of the POS Pulse interactive terminal architecture map.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset=".52" stop-color="#07111f"/><stop offset="1" stop-color="#101827"/></linearGradient><linearGradient id="screen" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#22d6f6"/><stop offset="1" stop-color="#0f766e"/></linearGradient><linearGradient id="gold" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#b88922"/></linearGradient><filter id="shadow" width="160%" height="190%" x="-30%" y="-40%"><feDropShadow dx="0" dy="16" flood-color="#000" flood-opacity=".52" stdDeviation="18"/></filter><filter id="glow" width="260%" height="260%" x="-80%" y="-80%"><feGaussianBlur stdDeviation="7"/></filter><style>@keyframes drift{0%{transform:translateX(-70px);opacity:0}12%,88%{opacity:1}}.kicker{fill:#22d6f6;font-size:12px;font-weight:850;letter-spacing:2.4px}.title{fill:#f8fafc;font-size:34px;font-weight:850}.copy{fill:#a7b0c0;font-size:15px}.label{fill:#f8fafc;font-size:14px;font-weight:850}.sub{fill:#a7b0c0;font-size:11px;font-weight:650}.rail{stroke:#22d6f6;stroke-width:2.4;stroke-linecap:round;stroke-dasharray:7 13;opacity:.72}.goldrail{stroke:#d4ad55}.grid{stroke:#263449;stroke-width:1;opacity:.55}.moving{animation:drift 5.2s ease-in-out infinite}</style></defs><rect width="1280" height="620" fill="url(#bg)"/><g opacity=".48"><path d="M80 520 H1190 M150 468 H1120 M220 416 H1050 M290 364 H980 M360 312 H910" class="grid"/><path d="M170 552 L590 246 M430 552 L700 246 M710 552 L810 246 M990 552 L925 246" class="grid"/></g><text x="58" y="68" class="kicker">SECURE WINDOWS POS TERMINAL</text><text x="58" y="108" class="title">POS Pulse terminal control surface</text><text x="58" y="138" class="copy">Renderer, typed preload bridge, Electron main, SQLite, safeStorage, API sync, and hardware boundaries.</text><g><path fill="#0c1422" stroke="#314159" d="M0 258 L430 70 L960 220 L496 414 Z" transform="translate(80 198)"/><path d="M132 246 C256 160 360 130 478 174 C594 218 686 218 816 172" class="rail" transform="translate(80 198)"/><path d="M344 326 C460 248 546 236 656 276 C756 312 830 296 930 250" class="rail goldrail" transform="translate(80 198)"/><g class="moving" transform="translate(80 198)"><circle cx="478" cy="174" r="16" fill="#22d6f6" filter="url(#glow)" opacity=".28"/><circle cx="478" cy="174" r="6" fill="#a8f4fb"/></g><g filter="url(#shadow)" transform="translate(80 198) translate(60 190)"><path fill="#10283a" stroke="#22d6f6" d="M0 32 L126 0 L252 32 L252 126 L126 170 L0 126 Z"/><path fill="url(#screen)" d="M26 46 L126 22 L226 46 L226 92 L126 124 L26 92 Z" opacity=".88"/><text x="126" y="116" class="label" text-anchor="middle">Renderer</text><text x="126" y="136" class="sub" text-anchor="middle">React POS UI</text></g><g filter="url(#shadow)" transform="translate(80 198) translate(390 104)"><path fill="#172033" stroke="#8b5cf6" d="M0 34 L114 0 L228 34 L228 126 L114 168 L0 126 Z"/><text x="114" y="88" class="label" text-anchor="middle">Typed bridge</text><text x="114" y="108" class="sub" text-anchor="middle">contextBridge only</text></g><g filter="url(#shadow)" transform="translate(80 198) translate(690 88)"><path fill="#1d2432" stroke="#d4ad55" stroke-width="2" d="M88 0 L190 38 L190 208 L88 254 L0 208 L0 38 Z"/><path fill="url(#gold)" d="M0 38 L88 76 L190 38 L88 0 Z"/><text x="95" y="132" class="label" text-anchor="middle">Electron main</text><text x="95" y="153" class="sub" text-anchor="middle">trusted process</text></g><g filter="url(#shadow)" transform="translate(80 198) translate(880 284)"><path fill="#12251f" stroke="#22c55e" d="M0 32 L118 0 L236 32 L236 116 L118 158 L0 116 Z"/><text x="118" y="86" class="label" text-anchor="middle">SQLite + hardware</text><text x="118" y="106" class="sub" text-anchor="middle">local durability</text></g><g filter="url(#shadow)" transform="translate(80 198) translate(296 340)"><path fill="#241828" stroke="#f97316" d="M0 30 L96 0 L192 30 L192 98 L96 132 L0 98 Z"/><text x="96" y="78" class="label" text-anchor="middle">Constitution gates</text></g></g></svg>