<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">Audit trail icon</title>
  <desc id="desc">Three-dimensional redacted audit document with verification mark.</desc>
  <defs>
    <linearGradient id="at-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="at-doc-back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cbd5e1"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="at-doc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="at-redact" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="at-check" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="at-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="96" height="96" rx="20" fill="url(#at-bg)"/>
  <ellipse cx="48" cy="86" rx="28" ry="3" fill="#0f172a" opacity="0.18"/>
  <g filter="url(#at-shadow)">
    <rect x="30" y="20" width="46" height="62" rx="6" fill="url(#at-doc-back)"/>
    <rect x="24" y="14" width="46" height="62" rx="6" fill="url(#at-doc)" stroke="#475569" stroke-width="2"/>
  </g>
  <g stroke="#64748b" stroke-width="3" stroke-linecap="round">
    <path d="M33 30h28"/>
    <path d="M33 41h20"/>
    <path d="M33 52h28"/>
  </g>
  <rect x="46" y="36" width="18" height="10" rx="3" fill="url(#at-redact)">
    <animate attributeName="opacity" values="1;0.7;1" dur="2.4s" repeatCount="indefinite"/>
  </rect>
  <g filter="url(#at-shadow)">
    <circle cx="60" cy="64" r="12" fill="url(#at-check)"/>
  </g>
  <path d="m55 64 4 4 8-9" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="stroke-dasharray" values="0 30;30 0" dur="1.6s" repeatCount="indefinite"/>
  </path>
</svg>
