<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">POS Pulse terminal hero</title>
  <desc id="desc">Enterprise POS terminal hero showing a Windows pharmacy checkout terminal connected to local state, operator session, hardware, and SaaS contracts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.52" stop-color="#10233d"/>
      <stop offset="1" stop-color="#153e3b"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="18" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
    <style>
      .eyebrow { font: 700 15px Arial, sans-serif; letter-spacing: 2px; fill: #67e8f9; }
      .title { font: 800 58px Arial, sans-serif; fill: #ffffff; }
      .copy { font: 500 21px Arial, sans-serif; fill: #cbd5e1; }
      .chip { font: 700 13px Arial, sans-serif; fill: #dbeafe; }
      .screenTitle { font: 800 20px Arial, sans-serif; fill: #ffffff; }
      .screenText { font: 700 13px Arial, sans-serif; fill: #dbeafe; }
    </style>
  </defs>
  <rect width="1280" height="520" fill="url(#bg)"/>
  <path d="M0 404 C180 340 312 432 490 362 C662 294 812 358 1000 286 C1124 239 1205 246 1280 218 L1280 520 L0 520 Z" fill="#0f766e" opacity="0.18"/>
  <path d="M0 462 C222 398 344 480 542 420 C730 362 852 426 1030 352 C1148 303 1214 316 1280 290 L1280 520 L0 520 Z" fill="#2563eb" opacity="0.15"/>

  <g transform="translate(76 92)">
    <text class="eyebrow" x="0" y="0">WINDOWS PHARMACY POS TERMINAL</text>
    <text class="title" x="0" y="72">POS Pulse</text>
    <text class="copy" x="0" y="118">Secure Electron checkout surface for pairing, operator</text>
    <text class="copy" x="0" y="150">sessions, local durability, and hardware-aware workflows.</text>
    <g transform="translate(0 204)">
      <rect width="146" height="38" rx="19" fill="#ffffff" opacity="0.1" stroke="#38bdf8" stroke-opacity="0.45"/>
      <text class="chip" x="22" y="25">Secure bridge</text>
      <rect x="164" width="142" height="38" rx="19" fill="#ffffff" opacity="0.1" stroke="#38bdf8" stroke-opacity="0.45"/>
      <text class="chip" x="187" y="25">Local SQLite</text>
      <rect x="324" width="148" height="38" rx="19" fill="#ffffff" opacity="0.1" stroke="#38bdf8" stroke-opacity="0.45"/>
      <text class="chip" x="348" y="25">Operator-safe</text>
    </g>
  </g>

  <g transform="translate(690 68)" filter="url(#shadow)">
    <rect x="0" y="0" width="470" height="340" rx="28" fill="#0f172a" stroke="#94a3b8" stroke-opacity="0.35"/>
    <rect x="28" y="28" width="414" height="236" rx="18" fill="url(#screen)"/>
    <rect x="68" y="298" width="334" height="22" rx="11" fill="#1e293b"/>
    <rect x="166" y="264" width="138" height="48" rx="10" fill="#334155"/>
    <text class="screenTitle" x="62" y="76">Checkout terminal</text>
    <text class="screenText" x="62" y="108">Branch paired · operator active · bridge locked</text>
    <g transform="translate(62 138)">
      <rect width="130" height="74" rx="12" fill="#ffffff" opacity="0.14"/>
      <text class="screenText" x="18" y="32">Cart</text>
      <text class="screenText" x="18" y="56">Scanner-ready</text>
      <rect x="150" width="130" height="74" rx="12" fill="#ffffff" opacity="0.14"/>
      <text class="screenText" x="168" y="32">Operator</text>
      <text class="screenText" x="168" y="56">Role scoped</text>
      <rect x="300" width="54" height="74" rx="12" fill="url(#amber)"/>
      <text class="screenText" x="316" y="43">Pay</text>
    </g>
  </g>
</svg>
