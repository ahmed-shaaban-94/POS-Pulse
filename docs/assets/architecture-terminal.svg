<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" aria-labelledby="title desc" role="img" viewBox="0 0 1280 720"><title id="title">POS Pulse terminal architecture</title><desc id="desc">Animated isometric architecture flow showing cashier, renderer, preload bridge, Electron main process, SQLite, safeStorage, backend API, and hardware. Data tokens flow along the connections.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset=".55" stop-color="#eef7f7"/><stop offset="1" stop-color="#f8f5ed"/></linearGradient><linearGradient id="blue" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset=".55" stop-color="#2563eb"/><stop offset="1" stop-color="#0891b2"/></linearGradient><linearGradient id="teal" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#14b8a6"/><stop offset=".55" stop-color="#0f766e"/><stop offset="1" stop-color="#134e4a"/></linearGradient><linearGradient id="amber" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset=".55" stop-color="#f59e0b"/><stop offset="1" stop-color="#b45309"/></linearGradient><linearGradient id="slate" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#475569"/><stop offset="1" stop-color="#0f172a"/></linearGradient><linearGradient id="cashier" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#e0e7ff"/><stop offset="1" stop-color="#a5b4fc"/></linearGradient><linearGradient id="paper" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#e2e8f0"/></linearGradient><linearGradient id="hi" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/></linearGradient><radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient><filter id="shadow" width="160%" hei