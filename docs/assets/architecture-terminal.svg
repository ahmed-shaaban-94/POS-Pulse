<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">POS Pulse terminal architecture</title>
  <desc id="desc">Isometric architecture view showing cashier, renderer, preload bridge, Electron main process, SQLite, safeStorage, backend API, and hardware.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.55" stop-color="#eef7f7"/>
      <stop offset="1" stop-color="#f8f5ed"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="slate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#475569"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <style>
      .title { font: 800 30px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 16px Arial, sans-serif; fill: #475569; }
      .white { font: 800 18px Arial, sans-serif; fill: #ffffff; }
      .whiteSmall { font: 600 13px Arial, sans-serif; fill: #e2e8f0; }
      .dark { font: 800 15px Arial, sans-serif; fill: #0f172a; }
      .small { font: 600 12px Arial, sans-serif; fill: #475569; }
      .line { stroke: #334155; stroke-width: 4; stroke-linecap: round; fill: none; }
      .dash { stroke: #64748b; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 8 10; fill: none; }
    </style>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <text x="72" y="72" class="title">POS Pulse Terminal Architecture</text>
  <text x="72" y="100" class="subtitle">Secure Electron boundary, typed preload bridge, local SQLite durability, and contract-backed SaaS integration.</text>

  <path d="M245 248 C340 196 430 198 520 238" class="line"/>
  <path d="M752 258 C826 252 894 280 960 330" class="line"/>
  <path d="M614 430 C610 490 566 532 496 556" class="dash"/>
  <path d="M702 424 C752 496 835 530 936 514" class="dash"/>

  <g filter="url(#shadow)">
    <polygon points="96,248 224,184 352,248 224,312" fill="#dbeafe"/>
    <polygon points="96,248 224,312 224,382 96,318" fill="#bfdbfe"/>
    <polygon points="224,312 352,248 352,318 224,382" fill="#93c5fd"/>
    <text x="176" y="252" class="dark">Cashier</text>
    <text x="150" y="282" class="small">Scanner / checkout</text>
  </g>

  <g filter="url(#shadow)">
    <polygon points="456,236 610,159 764,236 610,313" fill="url(#blue)"/>
    <polygon points="456,236 610,313 610,430 456,353" fill="#1d4ed8"/>
    <polygon points="610,313 764,236 764,353 610,430" fill="#0e7490"/>
    <text x="568" y="236" class="white">Renderer</text>
    <text x="532" y="266" class="whiteSmall">React POS shell</text>
    <text x="500" y="344" class="whiteSmall">No Node access</text>
    <text x="630" y="344" class="whiteSmall">Typed bridge only</text>
  </g>

  <g filter="url(#shadow)">
    <polygon points="940,330 1062,269 1184,330 1062,391" fill="url(#teal)"/>
    <polygon points="940,330 1062,391 1062,472 940,411" fill="#0f766e"/>
    <polygon points="1062,391 1184,330 1184,411 1062,472" fill="#115e59"/>
    <text x="1008" y="332" class="white">Main</text>
    <text x="994" y="362" class="whiteSmall">IPC + local services</text>
  </g>

  <g filter="url(#shadow)">
    <polygon points="336,558 496,478 656,558 496,638" fill="#ffffff"/>
    <polygon points="336,558 496,638 496,670 336,590" fill="#e2e8f0"/>
    <polygon points="496,638 656,558 656,590 496,670" fill="#cbd5e1"/>
    <text x="448" y="558" class="dark">Preload</text>
    <text x="400" y="586" class="small">contextBridge contract</text>
  </g>

  <g filter="url(#shadow)">
    <polygon points="806,540 948,469 1090,540 948,611" fill="url(#amber)"/>
    <polygon points="806,540 948,611 948,652 806,581" fill="#d97706"/>
    <polygon points="948,611 1090,540 1090,581 948,652" fill="#b45309"/>
    <text x="918" y="540" class="white">SQLite</text>
    <text x="892" y="570" class="whiteSmall">Local terminal state</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="880" y="112" width="226" height="72" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="910" y="145" class="dark">SmartDataPulse API</text>
    <text x="910" y="168" class="small">External SaaS backend</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="128" y="456" width="184" height="68" rx="12" fill="url(#slate)"/>
    <text x="160" y="486" class="white">Hardware</text>
    <text x="160" y="508" class="whiteSmall">Scanner printer drawer</text>
  </g>
</svg>
