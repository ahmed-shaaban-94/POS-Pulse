Motion><animate attributeName="opacity" dur="3.2s" repeatCount="indefinite" values="0;1;1;0"/></circle><circle r="4" fill="#22d3ee"><animateMotion begin="1.6s" dur="3.2s" repeatCount="indefinite" rotate="auto"><mpath href="#flow-1"/></animateMotion><animate attributeName="opacity" begin="1.6s" dur="3.2s" repeatCount="indefinite" values="0;1;1;0"/></circle></g><g><circle r="6" fill="#0f766e"><animateMotion dur="3s" repeatCount="indefinite" rotate="auto"><mpath href="#flow-2"/></animateMotion><animate attributeName="opacity" dur="3s" repeatCount="indefinite" values="0;1;1;0"/></circle><circle r="4" fill="#5eead4"><animateMotion begin="1.5s" dur="3s" repeatCount="indefinite" rotate="auto"><mpath href="#flow-2"/></animateMotion><animate attributeName="opacity" begin="1.5s" dur="3s" repeatCount="indefinite" values="0;1;1;0"/></circle></g><g><circle r="5" fill="#f59e0b"><animateMotion dur="3.6s" repeatCount="indefinite" rotate="auto"><mpath href="#flow-3"/></animateMotion><animate attributeName="opacity" dur="3.6s" repeatCount="indefinite" values="0;1;1;0"/></circle></g><g><circle r="5" fill="#f59e0b"><animateMotion begin="1.8s" dur="3.6s" repeatCount="indefinite" rotate="auto"><mpath href="#flow-4"/></animateMotion><animate attributeName="opacity" begin="1.8s" dur="3.6s" repeatCount="indefinite" values="0;1;1;0"/></circle></g><g><circle r="5" fill="#94a3b8"><animateMotion dur="4s" repeatCount="indefinite" rotate="auto"><mpath href="#flow-5"/></animateMotion><animate attributeName="opacity" dur="4s" repeatCount="indefinite" values="0;0.9;0.9;0"/></circle></g><g filter="url(#shadow)"><polygon fill="url(#cashier)" points="96 280 224 216 352 280 224 344"/><polygon fill="#a5b4fc" points="96 280 224 344 224 414 96 350"/><polygon fill="#818cf8" points="224 344 352 280 352 350 224 414"/><polygon fill="url(#hi)" points="96 280 224 216 352 280 224 344"/></g><text x="172" y="284" class="dark">Cashier</text><text x="146" y="314" class="small">Scanner · checkout · POS UX</text><g fil