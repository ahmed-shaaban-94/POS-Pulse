<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">Renderer icon</title>
  <desc id="desc">Three-dimensional React renderer window with floating UI surface.</desc>
  <defs>
    <linearGradient id="rn-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="rn-frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="rn-screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="rn-hi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="rn-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#1e3a8a" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="96" height="96" rx="20" fill="url(#rn-bg)"/>
  <ellipse cx="48" cy="84" rx="28" ry="3" fill="#1e3a8a" opacity="0.15"/>
  <g filter="url(#rn-shadow)">
    <rect x="14" y="20" width="68" height="50" rx="6" fill="url(#rn-frame)"/>
    <rect x="14" y="20" width="68" height="50" rx="6" fill="url(#rn-hi)"/>
    <rect x="18" y="26" width="60" height="40" rx="3" fill="url(#rn-screen)"/>
  </g>
  <g fill="#3b82f6">
    <circle cx="22" cy="22.5" r="1.4"/>
    <circle cx="26" cy="22.5" r="1.4"/>
    <circle cx="30" cy="22.5" r="1.4"/>
  </g>
  <g stroke="#0f766e" stroke-width="3" stroke-linecap="round">
    <path d="M26 36h20"/>
    <path d="M26 46h36"/>
    <path d="M26 56h26"/>
  </g>
  <rect x="58" y="33" width="14" height="6" rx="3" fill="#f59e0b"/>
  <rect x="38" y="74" width="20" height="4" rx="2" fill="#334155"/>
  <g opacity="0.9">
    <circle cx="48" cy="46" r="14" fill="none" stroke="#22d3ee" stroke-width="0.6" opacity="0.4">
      <animate attributeName="r" values="6;18;6" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="3.4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
