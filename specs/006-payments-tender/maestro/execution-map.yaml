# ---------------------------------------------------------------------------
# Groups (parallel-safe batches within each sub-slice)
# ---------------------------------------------------------------------------
# Per docs/maestro/graph-rules.md §"Process-boundary edges", all S3 work is
# single-agent. Groups below reflect the THEORETICAL parallel-safe sets from
# the preflight file-conflict analysis. They are informational — the executing
# agent processes them sequentially within each sub-slice wave.
groups:
  - sub_slice: 006-S3a
    waves:
      - id: Wave-A
        label: "S3a — Migration tables (partial parallel)"
        tasks:
          - T060  # payment_attempts (base table — T061 depends on it)
        serial_after_T060:
          - T061  # partial unique index (depends on T060)
        parallel_with_T060:
          - T062  # payment_tender_lines (independent of T060 at SQL level but FK dep — sequential)
          - T063  # payment_action_outbox
          - T065  # audit-category extension (independent of T060-T063)
        note: >
          T062 has FK -> payment_attempts, so T060 must land first.
          T063 has FK -> both tables; must follow T060 + T062.
          T064 (append-only trigger) depends on T063; serialised after T063.
          T065 is independent. Effective execution order: T060 -> T061 -> T062 -> T063 -> T064; T065 parallel after T060.
      - id: Wave-B
        label: "S3a — Migration integration test + repositories"
        tasks:
          - T066  # integration test (apply all 4 migrations)
          - T067  # §A3 sign-off record
          - T110  # migration runner registration
          - T111  # payment_attempts repository
          - T112  # payment_tender_lines repository
          - T113  # payment_action_outbox repository
