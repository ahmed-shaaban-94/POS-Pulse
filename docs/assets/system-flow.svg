<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">POS Pulse end-to-end transaction flow</title>
  <desc id="desc">Animated swim-lane flow showing a sale travelling from cashier through renderer, preload bridge, main process, SQLite, secrets, and out to the SaaS backend.</desc>
  <defs>
    <linearGradient id="sf-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0e2236"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="lane-a" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a8a" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#1e3a8a" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="lane-b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f766e" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#0f766e" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="lane-c" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="lane-d" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="node-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="node-teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="node-amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="node-violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="hi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#e2e8f0"/>
    </marker>
    <style>
      .title { font: 800 28px Arial, sans-serif; fill: #f1f5f9; }
      .subtitle { font: 500 15px Arial, sans-serif; fill: #94a3b8; }
      .lane { font: 800 14px Arial, sans-serif; letter-spacing: 1px; fill: #cbd5e1; }
      .nodeTitle { font: 800 16px Arial, sans-serif; fill: #ffffff; }
      .nodeText { font: 600 11px Arial, sans-serif; fill: #e2e8f0; }
      .pill { font: 700 11px Arial, sans-serif; fill: #f1f5f9; }
    </style>
    <!-- Hidden paths the data tokens travel along -->
    <path id="p1" d="M170 200 C220 200 240 200 290 200" fill="none"/>
    <path id="p2" d="M410 200 C460 200 480 200 530 200" fill="none"/>
    <path id="p3" d="M650 200 C700 200 720 200 770 200" fill="none"/>
    <path id="p4" d="M890 200 C940 200 960 200 1010 200" fill="none"/>
    <path id="p5" d="M830 240 C830 290 830 320 830 360" fill="none"/>
    <path id="p6" d="M830 460 C830 500 830 510 830 540" fill="none"/>
    <path id="p7" d="M1070 240 C1070 280 920 320 830 360" fill="none"/>
  </defs>
  <rect width="1280" height="640" fill="url(#sf-bg)"/>

  <!-- Header -->
  <text x="60" y="56" class="title">End-to-end transaction flow</text>
  <text x="60" y="84" class="subtitle">A sale travels through every process boundary — and never crosses one without a contract.</text>

  <!-- Lanes -->
  <g>
    <rect x="60" y="110" width="1160" height="80" rx="12" fill="url(#lane-a)" stroke="#1e3a8a" stroke-opacity="0.5"/>
    <text x="80" y="158" class="lane">RENDERER · UI</text>
    <rect x="60" y="350" width="1160" height="80" rx="12" fill="url(#lane-b)" stroke="#0f766e" stroke-opacity="0.5"/>
    <text x="80" y="398" class="lane">MAIN · CORE SERVICES</text>
    <rect x="60" y="530" width="1160" height="80" rx="12" fill="url(#lane-c)" stroke="#d97706" stroke-opacity="0.5"/>
    <text x="80" y="578" class="lane">LOCAL DURABLE STATE</text>
  </g>

  <!-- Lane connectors (vertical) -->
  <g stroke="#475569" stroke-width="1.5" stroke-dasharray="4 6" fill="none">
    <path d="M830 240 L830 350"/>
    <path d="M830 430 L830 530"/>
  </g>

  <!-- Connection paths (visible) -->
  <g stroke="#cbd5e1" stroke-width="2.5" fill="none" stroke-linecap="round" marker-end="url(#arrow)" opacity="0.7">
    <path d="M170 200 H290"/>
    <path d="M410 200 H530"/>
    <path d="M650 200 H770"/>
    <path d="M890 200 H1010"/>
  </g>
  <g stroke="#5eead4" stroke-width="2.5" fill="none" stroke-linecap="round" marker-end="url(#arrow)" opacity="0.65">
    <path d="M830 240 V360"/>
  </g>
  <g stroke="#fbbf24" stroke-width="2.5" fill="none" stroke-linecap="round" marker-end="url(#arrow)" opacity="0.65">
    <path d="M830 460 V540"/>
  </g>

  <!-- Nodes lane A (renderer) -->
  <g filter="url(#drop)" transform="translate(80 160)">
    <rect width="90" height="80" rx="14" fill="#1e3a8a"/>
    <rect width="90" height="80" rx="14" fill="url(#hi)"/>
    <rect width="90" height="80" rx="14" fill="none" stroke="#60a5fa" stroke-opacity="0.7"/>
    <text x="45" y="35" text-anchor="middle" class="nodeTitle">1</text>
    <text x="45" y="56" text-anchor="middle" class="nodeText">Scan</text>
    <text x="45" y="70" text-anchor="middle" class="nodeText">SKU</text>
  </g>
  <g filter="url(#drop)" transform="translate(290 160)">
    <rect width="120" height="80" rx="14" fill="url(#node-blue)"/>
    <rect width="120" height="80" rx="14" fill="url(#hi)"/>
    <text x="60" y="32" text-anchor="middle" class="nodeTitle">Cart</text>
    <text x="60" y="52" text-anchor="middle" class="nodeText">React state</text>
    <text x="60" y="68" text-anchor="middle" class="nodeText">money in minor units</text>
  </g>
  <g filter="url(#drop)" transform="translate(530 160)">
    <rect width="120" height="80" rx="14" fill="#ffffff"/>
    <rect width="120" height="80" rx="14" fill="url(#hi)"/>
    <text x="60" y="32" text-anchor="middle" class="nodeTitle" fill="#0f172a">Preload</text>
    <text x="60" y="52" text-anchor="middle" class="nodeText" fill="#475569">contextBridge</text>
    <text x="60" y="68" text-anchor="middle" class="nodeText" fill="#475569">typed contract</text>
  </g>
  <g filter="url(#drop)" transform="translate(770 160)">
    <rect width="120" height="80" rx="14" fill="url(#node-teal)"/>
    <rect width="120" height="80" rx="14" fill="url(#hi)"/>
    <text x="60" y="32" text-anchor="middle" class="nodeTitle">Validate</text>
    <text x="60" y="52" text-anchor="middle" class="nodeText">Zod + invariant</text>
    <text x="60" y="68" text-anchor="middle" class="nodeText">money rules</text>
  </g>
  <g filter="url(#drop)" transform="translate(1010 160)">
    <rect width="120" height="80" rx="14" fill="url(#node-violet)"/>
    <rect width="120" height="80" rx="14" fill="url(#hi)"/>
    <text x="60" y="32" text-anchor="middle" class="nodeTitle">Audit</text>
    <text x="60" y="52" text-anchor="middle" class="nodeText">redacted event</text>
    <text x="60" y="68" text-anchor="middle" class="nodeText">PII-free</text>
  </g>

  <!-- Main lane node -->
  <g filter="url(#drop)" transform="translate(770 360)">
    <rect width="120" height="80" rx="14" fill="url(#node-teal)"/>
    <rect width="120" height="80" rx="14" fill="url(#hi)"/>
    <text x="60" y="32" text-anchor="middle" class="nodeTitle">Commit</text>
    <text x="60" y="52" text-anchor="middle" class="nodeText">transactional</text>
    <text x="60" y="68" text-anchor="middle" class="nodeText">migration runner</text>
  </g>

  <!-- Storage lane node -->
  <g filter="url(#drop)" transform="translate(770 540)">
    <rect width="120" height="80" rx="14" fill="url(#node-amber)"/>
    <rect width="120" height="80" rx="14" fill="url(#hi)"/>
    <text x="60" y="32" text-anchor="middle" class="nodeTitle">SQLite</text>
    <text x="60" y="52" text-anchor="middle" class="nodeText">durable receipt</text>
    <text x="60" y="68" text-anchor="middle" class="nodeText">+ audit_events</text>
  </g>

  <!-- Side: API and Hardware -->
  <g filter="url(#drop)" transform="translate(1010 360)">
    <rect width="170" height="80" rx="14" fill="#0f172a" stroke="#22d3ee" stroke-opacity="0.6"/>
    <rect width="170" height="80" rx="14" fill="url(#hi)"/>
    <text x="20" y="34" class="nodeTitle">SaaS sync</text>
    <text x="20" y="56" class="nodeText">contract-backed</text>
    <text x="20" y="70" class="nodeText">when online · idempotent</text>
    <circle cx="156" cy="20" r="4" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g filter="url(#drop)" transform="translate(80 360)">
    <rect width="170" height="80" rx="14" fill="#0f172a" stroke="#f59e0b" stroke-opacity="0.7"/>
    <rect width="170" height="80" rx="14" fill="url(#hi)"/>
    <text x="20" y="34" class="nodeTitle">Hardware</text>
    <text x="20" y="56" class="nodeText">printer · drawer</text>
    <text x="20" y="70" class="nodeText">scanner (HID wedge)</text>
    <circle cx="156" cy="20" r="4" fill="#f59e0b">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Animated data tokens -->
  <g>
    <circle r="6" fill="#22d3ee" filter="url(#glow)">
      <animateMotion dur="6s" repeatCount="indefinite">
        <mpath href="#p1"/>
      </animateMotion>
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle r="6" fill="#22d3ee" filter="url(#glow)">
      <animateMotion dur="6s" begin="0.6s" repeatCount="indefinite">
        <mpath href="#p2"/>
      </animateMotion>
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;1" dur="6s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="6" fill="#5eead4" filter="url(#glow)">
      <animateMotion dur="6s" begin="1.2s" repeatCount="indefinite">
        <mpath href="#p3"/>
      </animateMotion>
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;1" dur="6s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="6" fill="#c4b5fd" filter="url(#glow)">
      <animateMotion dur="6s" begin="1.8s" repeatCount="indefinite">
        <mpath href="#p4"/>
      </animateMotion>
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;1" dur="6s" begin="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="6" fill="#5eead4" filter="url(#glow)">
      <animateMotion dur="6s" begin="2.4s" repeatCount="indefinite">
        <mpath href="#p5"/>
      </animateMotion>
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;1" dur="6s" begin="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="6" fill="#fbbf24" filter="url(#glow)">
      <animateMotion dur="6s" begin="3s" repeatCount="indefinite">
        <mpath href="#p6"/>
      </animateMotion>
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;1" dur="6s" begin="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="5" fill="#22d3ee" filter="url(#glow)">
      <animateMotion dur="7s" begin="4s" repeatCount="indefinite">
        <mpath href="#p7"/>
      </animateMotion>
      <animate attributeName="opacity" values="0;0.9;0" keyTimes="0;0.5;1" dur="7s" begin="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Step pills -->
  <g>
    <rect x="225" y="120" width="22" height="18" rx="9" fill="#22d3ee" opacity="0.85"/>
    <text x="236" y="134" text-anchor="middle" class="pill">1</text>
    <rect x="465" y="120" width="22" height="18" rx="9" fill="#22d3ee" opacity="0.85"/>
    <text x="476" y="134" text-anchor="middle" class="pill">2</text>
    <rect x="705" y="120" width="22" height="18" rx="9" fill="#22d3ee" opacity="0.85"/>
    <text x="716" y="134" text-anchor="middle" class="pill">3</text>
    <rect x="945" y="120" width="22" height="18" rx="9" fill="#22d3ee" opacity="0.85"/>
    <text x="956" y="134" text-anchor="middle" class="pill">4</text>
  </g>
</svg>
