<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">POS Pulse terminal hero</title>
  <desc id="desc">Animated enterprise POS hero showing a Windows pharmacy terminal with live bridge, paired branch context, and active operator session.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.5" stop-color="#0b1e34"/>
      <stop offset="1" stop-color="#0e2e2e"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="0.5" stop-color="#0891b2"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="hi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="aurora" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="glowBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <style>
      .eyebrow { font: 700 15px Arial, sans-serif; letter-spacing: 2px; fill: #67e8f9; }
      .title { font: 800 64px Arial, sans-serif; fill: #ffffff; }
      .copy { font: 500 21px Arial, sans-serif; fill: #cbd5e1; }
      .chip { font: 700 13px Arial, sans-serif; fill: #dbeafe; }
      .screenTitle { font: 800 20px Arial, sans-serif; fill: #ffffff; }
      .screenText { font: 700 13px Arial, sans-serif; fill: #dbeafe; }
      .tiny { font: 600 11px Arial, sans-serif; fill: #94a3b8; }
    </style>
  </defs>
  <rect width="1280" height="520" fill="url(#bg)"/>

  <!-- Aurora wash -->
  <ellipse cx="920" cy="260" rx="420" ry="200" fill="url(#aurora)">
    <animate attributeName="rx" values="420;460;420" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="6s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Layered waves -->
  <path d="M0 404 C180 340 312 432 490 362 C662 294 812 358 1000 286 C1124 239 1205 246 1280 218 L1280 520 L0 520 Z" fill="#0f766e" opacity="0.18"/>
  <path d="M0 462 C222 398 344 480 542 420 C730 362 852 426 1030 352 C1148 303 1214 316 1280 290 L1280 520 L0 520 Z" fill="#2563eb" opacity="0.16"/>

  <!-- Grid lines (subtle) -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <path d="M0 130h1280M0 200h1280M0 270h1280M0 340h1280M0 410h1280"/>
  </g>

  <!-- Floating particles -->
  <g fill="#67e8f9">
    <circle cx="120" cy="380" r="2">
      <animate attributeName="cy" values="380;370;380" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="420" cy="430" r="2.5">
      <animate attributeName="cy" values="430;415;430" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;1;0.3" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="240" cy="460" r="2">
      <animate attributeName="cy" values="460;448;460" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g transform="translate(76 92)">
    <text class="eyebrow" x="0" y="0" opacity="0">WINDOWS PHARMACY POS TERMINAL
      <animate attributeName="opacity" from="0" to="1" dur="0.8s" fill="freeze"/>
    </text>
    <text class="title" x="0" y="76" opacity="0">POS Pulse
      <animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="0.2s" fill="freeze"/>
    </text>
    <text class="copy" x="0" y="124" opacity="0">Secure Electron checkout surface for pairing, operator
      <animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="0.5s" fill="freeze"/>
    </text>
    <text class="copy" x="0" y="156" opacity="0">sessions, local durability, and hardware-aware workflows.
      <animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="0.7s" fill="freeze"/>
    </text>
    <g transform="translate(0 210)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="0.95s" fill="freeze"/>
      <rect width="146" height="38" rx="19" fill="#ffffff" opacity="0.1" stroke="#38bdf8" stroke-opacity="0.55"/>
      <circle cx="18" cy="19" r="3" fill="#22d3ee">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <text class="chip" x="32" y="25">Secure bridge</text>
      <rect x="164" width="142" height="38" rx="19" fill="#ffffff" opacity="0.1" stroke="#38bdf8" stroke-opacity="0.55"/>
      <circle cx="182" cy="19" r="3" fill="#f59e0b">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1.6s" begin="0.5s" repeatCount="indefinite"/>
      </circle>
      <text class="chip" x="196" y="25">Local SQLite</text>
      <rect x="324" width="148" height="38" rx="19" fill="#ffffff" opacity="0.1" stroke="#38bdf8" stroke-opacity="0.55"/>
      <circle cx="342" cy="19" r="3" fill="#34d399">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1.6s" begin="1s" repeatCount="indefinite"/>
      </circle>
      <text class="chip" x="356" y="25">Operator-safe</text>
    </g>
  </g>

  <!-- Terminal frame -->
  <g transform="translate(690 60)" filter="url(#shadow)">
    <rect x="0" y="0" width="470" height="360" rx="28" fill="url(#bezel)" stroke="#94a3b8" stroke-opacity="0.4"/>
    <rect x="0" y="0" width="470" height="360" rx="28" fill="url(#hi)" opacity="0.4"/>
    <rect x="28" y="28" width="414" height="246" rx="18" fill="url(#screen)"/>
    <rect x="28" y="28" width="414" height="20" rx="6" fill="#0f172a" opacity="0.4"/>
    <circle cx="44" cy="38" r="4" fill="#ef4444"/>
    <circle cx="58" cy="38" r="4" fill="#f59e0b"/>
    <circle cx="72" cy="38" r="4" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.4;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>

    <!-- Terminal stand -->
    <rect x="68" y="308" width="334" height="22" rx="11" fill="#1e293b"/>
    <rect x="166" y="274" width="138" height="48" rx="10" fill="#334155"/>

    <!-- Screen content -->
    <text class="screenTitle" x="62" y="84">Checkout terminal</text>
    <text class="screenText" x="62" y="112">
      <tspan>Branch paired</tspan>
      <tspan dx="6" fill="#67e8f9">●</tspan>
      <tspan dx="6">operator active</tspan>
      <tspan dx="6" fill="#67e8f9">●</tspan>
      <tspan dx="6">bridge locked</tspan>
    </text>

    <g transform="translate(62 142)">
      <rect width="130" height="76" rx="12" fill="#ffffff" opacity="0.16"/>
      <text class="screenText" x="18" y="30">Cart</text>
      <text class="tiny" x="18" y="50" fill="#bae6fd">Scanner-ready</text>
      <g transform="translate(18 58)">
        <rect width="94" height="6" rx="3" fill="#0ea5e9" opacity="0.3"/>
        <rect width="0" height="6" rx="3" fill="#22d3ee">
          <animate attributeName="width" values="0;94;0" dur="3.4s" repeatCount="indefinite"/>
        </rect>
      </g>

      <rect x="150" width="130" height="76" rx="12" fill="#ffffff" opacity="0.16"/>
      <text class="screenText" x="168" y="30">Operator</text>
      <text class="tiny" x="168" y="50" fill="#bae6fd">Role scoped</text>
      <circle cx="170" cy="62" r="3" fill="#34d399">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text class="tiny" x="180" y="66" fill="#bae6fd">Live</text>

      <rect x="300" width="54" height="76" rx="12" fill="url(#amber)"/>
      <rect x="300" width="54" height="76" rx="12" fill="url(#hi)"/>
      <text class="screenText" x="316" y="43">Pay</text>
      <circle cx="327" cy="60" r="6" fill="#ffffff" opacity="0.4">
        <animate attributeName="r" values="6;12;6" dur="2.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;0;0.5" dur="2.2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Scanline -->
    <rect x="28" y="48" width="414" height="2" fill="#22d3ee" opacity="0">
      <animate attributeName="y" values="48;272;48" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Connection lines from text side to terminal -->
  <g stroke="#22d3ee" stroke-width="1" opacity="0.5" fill="none" stroke-dasharray="3 5">
    <path d="M624 320 L686 250"/>
  </g>
</svg>
